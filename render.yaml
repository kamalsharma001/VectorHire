services:
  - type: web
    name: vectorhire-api
    env: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: VectorHire
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-1.5-flash
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_FALLBACK_MODEL
        value: qwen/qwen3.8-27b
      - key: CORS_ORIGINS
        value: "https://vectorhire-platform.vercel.app"
      - key: UNCERTAINTY_DISCOUNT_GAMMA
        value: "0.50"
      - key: MAX_BATCH_SIZE
        value: "10"
      - key: MAX_FILE_SIZE_MB
        value: "10"
      - key: MAX_CONCURRENT_REQUESTS
        value: "3"
